<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Creamery">
<meta name="theme-color" content="#f4f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110e1d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Campus Creamery Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: phone is one column with a sticky bottom bar; laptop is two columns,
   freezer and week on the left, today's orders and mix-ins on the right.
   The freezer lids are the one bold element; everything else stays quiet. */
:root {
  --ground: #f4f3f8;
  --surface: #ffffff;
  --ink: #1c1631;
  --muted: #67607d;
  --rule: #e2dfea;
  --rule-strong: #c9c4d8;
  --accent: #5a34d0;
  --accent-ink: #ffffff;
  --accent-soft: #eee8fd;
  --well: #dfe9f0;
  --steel: #c3cfd9;
  --tub-empty: #f3f7fa;
  --van: #f2d488; --van-rim: #c7a44a;
  --choc: #6a4130; --choc-rim: #452a1d;
  --mint: #82cbae; --mint-rim: #3f8f6f;
  --now: #bf3328; --now-soft: #fbe6e3;
  --soon: #985b00; --soon-soft: #fbefd9;
  --ok: #2d7a4f; --ok-soft: #e3f2e9;
  --display: "Unbounded", "Avenir Next", "Futura", system-ui, sans-serif;
  --text: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #110e1d; --surface: #1a1629; --ink: #edeaf7; --muted: #a29bbb; --rule: #2c2642; --rule-strong: #453d61;
  --accent: #a88dff; --accent-ink: #160f2e; --accent-soft: #261e47; --well: #172230; --steel: #2b3644; --tub-empty: #0f1720;
  --van: #e8cc7d; --van-rim: #b8963f; --choc: #a4725b; --choc-rim: #d09a80; --mint: #78c9a9; --mint-rim: #a5e2c9;
  --now: #f27d72; --now-soft: #3a1915; --soon: #e5aa4c; --soon-soft: #33260f; --ok: #6fcb96; --ok-soft: #132e1f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #110e1d; --surface: #1a1629; --ink: #edeaf7; --muted: #a29bbb; --rule: #2c2642; --rule-strong: #453d61;
  --accent: #a88dff; --accent-ink: #160f2e; --accent-soft: #261e47; --well: #172230; --steel: #2b3644; --tub-empty: #0f1720;
  --van: #e8cc7d; --van-rim: #b8963f; --choc: #a4725b; --choc-rim: #d09a80; --mint: #78c9a9; --mint-rim: #a5e2c9;
  --now: #f27d72; --now-soft: #3a1915; --soon: #e5aa4c; --soon-soft: #33260f; --ok: #6fcb96; --ok-soft: #132e1f;
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.45; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.06rem; font-weight: 600; letter-spacing: -0.005em; text-wrap: balance; }
h3 { font-size: 0.98rem; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.tnum { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; }

.shell { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 110px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 38px; height: 38px; flex: none; }
.wordmark { font-family: var(--display); font-weight: 600; font-size: 1.08rem; letter-spacing: -0.02em; line-height: 1.1; }
.status { font-size: 0.875rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--now); } .dot.wait { background: var(--soon); }
.top-actions { display: none; gap: 8px; }

.btn { cursor: pointer; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 12px; padding: 10px 16px; min-height: 44px; font-weight: 600; font-size: 0.95rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; min-height: 36px; }
.btn:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.grid { display: flex; flex-direction: column; gap: 30px; }
.col { display: contents; }
.section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* freezer */
.freezer { background: var(--steel); border-radius: 26px; padding: 10px; }
.freezer-well { background: var(--well); border-radius: 18px; padding: 12px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.06); }
.lid { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; }
.readout { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.readout .big { font-family: var(--display); font-size: 2.5rem; font-weight: 500; line-height: 1; letter-spacing: -0.04em; }
.readout .big span { font-family: var(--text); font-size: 1rem; letter-spacing: 0; color: var(--muted); font-weight: 500; margin-left: 6px; }
.meter { display: grid; grid-template-columns: repeat(var(--cap), 1fr); gap: 3px; position: relative; padding-top: 18px; }
.seg { height: 10px; border-radius: 3px; background: var(--rule); overflow: hidden; position: relative; }
.seg i { position: absolute; inset: 0 auto 0 0; background: var(--ink); opacity: 0.82; }
.meter .floormark { position: absolute; top: 0; font-size: 0.75rem; color: var(--accent); white-space: nowrap; transform: translateX(-50%); }
.meter .floormark::after { content: ""; position: absolute; left: 50%; top: 15px; width: 2px; height: 16px; background: var(--accent); }
.tallies { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.tally { padding: 12px 12px 4px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tally .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 2px solid; }
.tally .n { font-family: var(--display); font-size: 1.7rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1.15; }
.tally .n small { font-family: var(--text); font-size: 0.9rem; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.tally .sub { font-size: 0.8rem; color: var(--muted); }

/* order panels */
.panel { border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--rule); }
.panel.act { background: var(--accent-soft); border-color: transparent; }
.panel .lead { font-size: 1.28rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; }
.when-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface); }
.lines { display: flex; flex-direction: column; }
.line { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--rule-strong); }
.panel:not(.act) .line { border-top-color: var(--rule); }
.line .q { font-family: var(--display); font-size: 1.45rem; font-weight: 500; letter-spacing: -0.03em; text-align: right; }
.line .what { min-width: 0; }
.line .code { font-size: 0.8rem; color: var(--muted); }
.line .cost { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.sum { display: flex; justify-content: space-between; font-weight: 600; padding-top: 10px; border-top: 1px solid var(--rule-strong); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 0.875rem; color: var(--muted); }
.flag { border-radius: 12px; padding: 11px 13px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 8px; }
.flag.now { background: var(--now-soft); color: var(--ink); border-left: 0; box-shadow: inset 0 0 0 1px var(--now); }
.flag.soon { background: var(--soon-soft); box-shadow: inset 0 0 0 1px var(--soon); }
.flag.ok { background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }

/* week */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; position: relative; }
.plot { position: relative; height: 150px; margin-top: 18px; grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; border-bottom: 1px solid var(--rule-strong); }
.bar { position: relative; display: flex; flex-direction: column-reverse; align-items: stretch; height: 100%; justify-content: flex-start; }
.bar .stack { display: flex; flex-direction: column-reverse; width: 62%; margin: 0 auto; border-radius: 6px 6px 0 0; overflow: hidden; }
.bar .stack b { display: block; }
.bar .lbl { position: absolute; left: 0; right: 0; text-align: center; font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar .fl { position: absolute; left: 6%; right: 6%; height: 0; border-top: 2px dotted var(--accent); }
.bar .after { position: absolute; left: 12%; right: 12%; height: 2px; background: var(--ink); }
.hline { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed; pointer-events: none; }
.hline span { position: absolute; left: 0; top: -1.3em; font-size: 0.72rem; background: var(--ground); padding-right: 4px; }
.hline.cap { border-color: var(--now); } .hline.cap span { color: var(--now); }
.hline.floor { border-color: var(--accent); } .hline.floor span { color: var(--accent); }
.days { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 0.8rem; }
.days div { display: flex; flex-direction: column; gap: 1px; }
.days strong { font-weight: 600; }
.days .arr { color: var(--ok); font-weight: 600; }

/* pantry */
.shelf { display: flex; flex-direction: column; gap: 4px; }
.shelf-name { font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-top: 10px; }
.goods { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.good { display: grid; grid-template-columns: minmax(4.5rem, auto) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.pkgs { display: flex; align-items: flex-end; gap: 3px; min-height: 30px; }
.pkg { width: 16px; height: 24px; flex: none; }
.pkgs .more { font-size: 0.75rem; color: var(--muted); margin-left: 2px; }
.good .nm { font-weight: 600; line-height: 1.2; }
.good .meta { font-size: 0.82rem; color: var(--muted); }
.good .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.good .amt { font-variant-numeric: tabular-nums; font-size: 0.92rem; }
@media (min-width: 640px) and (max-width: 959px) { .goods { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; } }
/* mix-ins */
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 0; border-top: 1px solid var(--rule); align-items: center; }
.item .nm { font-weight: 600; min-width: 0; }
.item .meta { font-size: 0.82rem; color: var(--muted); grid-column: 1; }
.item .qty { text-align: right; font-variant-numeric: tabular-nums; grid-row: 1; grid-column: 2; }
.item .st { grid-column: 2; justify-self: end; }
.pill { display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.now { background: var(--now-soft); color: var(--now); }
.pill.soon { background: var(--soon-soft); color: var(--soon); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
details.more { border-top: 1px solid var(--rule); padding-top: 10px; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; min-height: 32px; display: flex; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more p { margin-top: 6px; font-size: 0.9rem; color: var(--muted); }

.log { display: flex; flex-direction: column; }
.log div { padding: 8px 0; border-top: 1px solid var(--rule); font-size: 0.9rem; display: grid; grid-template-columns: 6.6rem minmax(0, 1fr); gap: 10px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { border: 1.5px dashed var(--rule-strong); border-radius: 14px; padding: 16px; color: var(--muted); }
.foot { margin-top: 36px; font-size: 0.82rem; color: var(--muted); max-width: 70ch; }
.alerts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.alerts:empty { display: none; }

/* bottom bar (phone) */
.bar-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--rule); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.bar-bottom .btn { width: 100%; padding-inline: 8px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(12, 8, 26, 0.5); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
.sheet header h2 { font-size: 1.15rem; }
.sheet .body { overflow-y: auto; padding: 6px 18px 18px; -webkit-overflow-scrolling: touch; }
.sheet footer { padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.grp { margin-top: 16px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
.crow.touched .cname::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: 1px; }
.cname { font-weight: 600; }
.csub { font-size: 0.8rem; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule-strong); background: var(--ground); cursor: pointer; font-size: 1.3rem; line-height: 1; }
.stepper .v { min-width: 3.4ch; text-align: center; font-family: var(--display); font-size: 1.2rem; font-weight: 500; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
input[type="number"], input[type="date"], input[type="password"], input[type="text"], select { padding: 9px 11px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--ground); min-height: 44px; font-size: 1rem; }
input[type="number"] { width: 6.5em; font-variant-numeric: tabular-nums; }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ground); padding: 11px 16px; border-radius: 12px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }

/* passcode */
.gate { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.gate form, .gate .gate-box { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
.gate input { width: 100%; font-size: 1.2rem; letter-spacing: 0.08em; }

@media (min-width: 720px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 22px; max-height: 86vh; }
  .toast { bottom: 24px; }
}
@media (min-width: 960px) {
  .shell { padding-block: 24px 48px; }
  .top-actions { display: flex; }
  .bar-bottom { display: none; }
  .grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 36px 44px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
  #activity { grid-column: 1 / -1; }
  .freezer-well { gap: 12px; padding: 18px; }
  .readout .big { font-size: 3rem; }
}
@media (max-width: 380px) { .freezer-well { gap: 5px; padding: 9px; } .freezer { padding: 7px; } }
@media (prefers-reduced-motion: no-preference) { .lid .wedge { transition: d 0.4s ease; } .seg i { transition: width 0.4s ease; } }

body { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<template id="shellTpl">
  <div class="shell" id="shell">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--accent)"/><circle cx="20" cy="20" r="12.5" fill="var(--van)"/><path d="M20 20 L20 7.5 A12.5 12.5 0 0 1 32.5 20 Z" fill="var(--choc)"/></svg>
        <div>
          <div class="wordmark">Campus Creamery</div>
          <div class="status" id="status">Loading…</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn primary" data-act="open-count">Count</button>
        <button class="btn" data-act="open-delivery">Add delivery</button>
        <button class="btn" data-act="open-settings">Settings</button>
      </div>
    </header>
    <div class="alerts" id="alerts"></div>
    <div class="grid">
      <div class="col">
        <section class="section" id="freezer" style="order:1"><div class="empty">Loading your counts…</div></section>
        <section class="section" id="pantry" style="order:4"></section>
        <section class="section" id="week" style="order:5"></section>
      </div>
      <div class="col">
        <section class="section" id="gordon" style="order:2"></section>
        <section class="section" id="sams" style="order:3"></section>
      </div>
      <section class="section" id="activity" style="order:7"></section>
    </div>
    <p class="foot">Not tracked here: Biscoff, Nutella, cups and Dairy Free. Square sales arrive about every 15 minutes. Servings per tub and mix-in amounts adjust a little with every count.</p>
  </div>
  <nav class="bar-bottom" aria-label="Actions">
    <button class="btn primary" data-act="open-count">Count</button>
    <button class="btn" data-act="open-delivery">Delivery</button>
    <button class="btn" data-act="open-settings">Settings</button>
  </nav>
</template>
<div id="root"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* Campus Creamery inventory engine: pure functions, no I/O.
   Used inline by the app page and tested in node. */
const Engine = (() => {
  const TZ = "America/Chicago";
  const DAY_START_HOUR = 4; // Square reporting day starts at 4 AM

  // ---------- catalog ----------
  // perUnit: usage units in one counted unit. Usage units are servings,
  // except Oreos (cookies) and cans. pack: counted units per thing you buy.
  const CATALOG = [
    { key: "vanilla", name: "Vanilla", group: "ice", unit: "tub", supplier: "gordon", code: "788805", pack: 1, price: 31.79, step: 0.25 },
    { key: "chocolate", name: "Chocolate", group: "ice", unit: "tub", supplier: "gordon", code: "442683", pack: 1, price: 31.79, step: 0.25 },
    { key: "exclusive", name: "Exclusive", group: "ice", unit: "tub", supplier: "gordon", code: "", pack: 1, price: 0, step: 0.25 },
    { key: "oreos", name: "Oreos", group: "mix", shelf: "cookies", color: "#2f2a3a", unit: "box", unitNote: "156 cookies", perUnit: 156, supplier: "sams", buy: "OREO 12-pack, 156 cookies", pack: 1, price: 10.98, step: 0.25 },

    <div class="tallies">${tally("vanilla", "v")}${tally("chocolate", "c")}${showE ? tally("exclusive", "e") : ""}</div>`;
}

function lineHTML(key, qty, st, note) {
  const c = E.BY_KEY[key], code = codeOf(key, st), price = priceOf(key, st);
  const label = c.group === "ice" ? `${nameOf(key, st)} tub${qty === 1 ? "" : "s"}` : (c.buy || c.name);
  const sub = [SUP[c.supplier] ? `from ${SUP[c.supplier]}` : "", code ? `item ${code}` : "", note || ""].filter(Boolean).join(", ");
  return `<div class="line"><span class="q">${qty}</span><span class="what">${esc(label)}<br><span class="code">${esc(sub)}</span></span><span class="cost">${price ? money(qty * price) : ""}</span></div>`;
}
function orderText(lines, st, supplier, extra) {
  return `${SUP[supplier]} order${extra ? ", " + extra : ""}\n` + Object.entries(lines).filter(([, q]) => q > 0).map(([k, q]) => {
    const code = codeOf(k, st); return `${lineLabel(k, q, st)}${code ? " (item " + code + ")" : ""}`;
  }).join("\n");
}
function dueHTML(m, supplier) {
  return (m.due || []).filter(o => o.supplier === supplier).map(o => {
    const items = Object.entries(o.lines || {}).filter(([, q]) => q > 0).map(([k, q]) => `${q} ${nameOf(k, m.st).toLowerCase()}`).join(", ");
    const late = o.arrivesOn < m.cal;
    return `<div class="flag soon"><strong>${SUP[supplier]} delivery ${late ? "was due " + E.DOW_LONG[E.weekday(o.arrivesOn)] : "due today"}${o.window ? ", " + esc(o.window) : ""}</strong><span>${esc(items)}</span><div class="actions"><button class="btn primary" data-act="arrived" data-id="${esc(o.id)}">It arrived</button><button class="btn" data-act="notcoming" data-id="${esc(o.id)}">It didn't come</button></div></div>`;
  }).join("");
}
function windowsText(p, cal) {
  const day = p.arriveOn === cal ? "today" : "tomorrow";

}
function renderGordon(m) {

      <p class="note">Order ${windowsText(p, m.cal)} delivery. ${esc(p.reasons.join(". "))} without it.</p>
      <div class="lines">${Object.entries(lines).map(([k, q]) => lineHTML(k, q, st, E.BY_KEY[k].group !== "ice" ? "running low, added to save a delivery" : "")).join("")}</div>
      <div class="sum"><span>Total</span><span class="tnum">${money(total)}</span></div>
      ${fee ? `<div class="flag soon"><span>Under ${money(st.gordon.minimum)}, Gordon's adds a ${money(st.gordon.fee)} delivery fee.</span></div>` : ""}
      <p class="note">When it arrives the freezer will hold about ${fmtQ(p.atArrival)} of ${st.cap} tubs.</p>
      ${urgent}
      <div class="actions"><button class="btn primary" data-act="place-gordon">I placed this order</button><button class="btn" data-act="copy-gordon">Copy order</button></div></div>`;

    el.innerHTML = `${due}<div class="panel">
      <div class="section-head"><h2>Gordon's order is in</h2><span class="pill ok">Arrives ${dayWord(p.arriveOn, m.cal)}</span></div>
      <div class="lines">${items}</div>
      ${p.trim ? `<div class="flag now"><strong>Cut ${p.trim.over} ${esc(nameOf(p.trim.flavor, st).toLowerCase())} from this order.</strong><span>Tonight was slower than planned. As ordered, the freezer would hit about ${fmtQ(p.atArrival)} tubs. Change it in Gordon Ordering, then update it here.</span><div class="actions"><button class="btn primary" data-act="edit-order" data-id="${esc(id)}">Update the order</button></div></div>` : `<p class="note">The freezer should hold about ${fmtQ(p.atArrival)} of ${st.cap} tubs after it arrives.</p>`}
      ${urgent}<div class="actions"><button class="btn" data-act="edit-order" data-id="${esc(id)}">Change quantities</button></div></div>`;
  } else {

    const nextTxt = next ? `Next order is likely ${E.DOW_LONG[E.weekday(next.ds)]} morning, about ${Object.entries(next.ordered).filter(([, q]) => q > 0).map(([k, q]) => lineLabel(k, q, st).toLowerCase()).join(" and ")} from Gordon's.` : "No Gordon's order looks needed this week.";
    const fl = p.floorA0 ? `${fmtQ(p.floorA0.vanilla)} vanilla and ${fmtQ(p.floorA0.chocolate)} chocolate` : "";
    el.innerHTML = `${due}<div class="panel">

function renderSams(m) {
  const el = $("sams"), st = m.st;
  if (!m.ready) { el.innerHTML = ""; return; }
  const due = dueHTML(m, "sams"), plan = m.sup.plans.sams;
  const anyPlan = m.sup.plans.any || { basket: [], due: [], orderToday: false };
  S.lastSams = null;
  const left = x => x.filler ? "added to reach the delivery minimum" : `about ${x.cover} night${x.cover === 1 ? "" : "s"} left`;
  const coverOf = keys => Math.min(...m.sup.rows.filter(r => keys.includes(r.key)).map(r => r.cover));
  const byWhen = cover => { const d = E.addDays(m.today, cover); return cover <= 0 ? "right away" : `before ${d === E.addDays(m.today, 1) ? "tomorrow night" : E.DOW_LONG[E.weekday(d)] + " night"}`; };
  // Items bought at any store (Cookie Crisp) ride along with a Sam's order. If one runs low
  // while nothing from Sam's is due, it gets its own short card instead of forcing a Sam's order.
  const anyAlone = anyPlan.orderToday && !plan.orderToday;
  const anyHTML = anyAlone ? `<div class="panel act"><div class="section-head"><h2>Buy ${anyPlan.basket.map(x => nameOf(x.key, st)).join(" and ")} ${byWhen(coverOf(anyPlan.due))}</h2><span class="when-chip">Buy now</span></div>
    <div class="lines">${anyPlan.basket.map(x => lineHTML(x.key, x.packs, st, left(x))).join("")}</div>
    <div class="actions"><button class="btn" data-act="bought-any" data-key="${esc(anyPlan.basket[0].key)}" data-qty="${anyPlan.basket[0].packs}">I bought it</button></div></div>` : "";
  const counted = m.sup.rows.some(r => E.BY_KEY[r.key].supplier === "sams" && r.status !== "uncounted");
  if (!counted) { el.innerHTML = due + anyHTML + `<div class="panel"><h2>Sam's Club</h2><p class="muted">Count your mix-ins to plan Sam's orders.</p></div>`; return; }
  if (!plan.basket.length) { el.innerHTML = due + anyHTML + `<div class="panel"><div class="section-head"><h2>Sam's Club</h2><span class="pill ok">Stocked</span></div><p>Nothing needed for at least ${st.supplies.topUpBelow} nights.</p><div class="actions"><button class="btn" data-act="log-sams">Log an order you placed</button></div></div>`; return; }
  const basket = plan.basket.concat(anyAlone ? [] : anyPlan.basket);
  const lines = Object.fromEntries(basket.map(x => [x.key, x.packs]));
  const total = plan.value, fee = total < st.supplies.samsMinimum;
  const needDay = plan.orderToday ? m.today : plan.needBy;
  const dueKeys = plan.due.concat(anyAlone ? [] : anyPlan.due);
  // When something is due, say which night it would run out, so the deadline is clear at any hour.
  const head = !plan.orderToday ? `Next Sam's Club order ${needDay ? E.DOW_LONG[E.weekday(needDay)] : "this week"}` : `Order from Sam's Club ${byWhen(coverOf(dueKeys))}`.replace("Club before", "Club, needed before");
  S.lastSams = { lines };
  el.innerHTML = `${due}${anyHTML}<div class="panel ${plan.orderToday ? "act" : ""}">
    <div class="section-head"><h2>${head}</h2><span class="${plan.orderToday ? "when-chip" : "pill soon"}">${plan.orderToday ? "Order now" : "Planned"}</span></div>
    <p class="note">${plan.orderToday ? `${dueKeys.map(k => nameOf(k, st)).join(" and ")} can't wait another day.` : "Nothing is urgent yet. This is what the order will look like."} Everything running low is grouped into one order with about ${st.supplies.coverTo} nights of each.</p>
    <div class="lines">${basket.map(x => lineHTML(x.key, x.packs, st, left(x))).join("")}</div>
    <div class="sum"><span>Total</span><span class="tnum">${money(total)}</span></div>
    ${fee ? `<div class="flag soon"><span>Still under ${money(st.supplies.samsMinimum)}, so Sam's may add a delivery fee.</span></div>` : ""}
    <div class="actions">${plan.orderToday ? `<button class="btn primary" data-act="place-sams">I placed this order</button>` : ""}<button class="btn" data-act="copy-sams">Copy list</button>${!plan.orderToday ? `<button class="btn" data-act="place-sams">Order it now anyway</button>` : ""}</div></div>`;
}

function pkgSVG(c, frac) {
  const col = c.color || "var(--accent)";
  const h = Math.max(0, Math.min(1, frac));
  if (c.unit === "bag") {
    return `<svg class="pkg" viewBox="0 0 16 24" aria-hidden="true"><defs><clipPath id="b${c.key}${Math.round(h * 100)}"><path d="M2 3h12l1 17a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3z"/></clipPath></defs><path d="M2 3h12l1 17a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3z" fill="var(--tub-empty)"/><rect x="0" y="${(24 - 21 * h).toFixed(2)}" width="16" height="24" fill="${col}" clip-path="url(#b${c.key}${Math.round(h * 100)})"/><path d="M2 3h12l1 17a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3z" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><path d="M1.5 1.5h13" stroke="var(--rule-strong)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  }
  return `<svg class="pkg" viewBox="0 0 16 24" aria-hidden="true"><rect x="1" y="3" width="14" height="20" rx="1.5" fill="var(--tub-empty)"/><rect x="1" y="${(3 + 20 * (1 - h)).toFixed(2)}" width="14" height="${(20 * h).toFixed(2)}" fill="${col}"/><rect x="1" y="3" width="14" height="20" rx="1.5" fill="none" stroke="var(--rule-strong)" stroke-width="1"/><path d="M1 3l2-2h10l2 2" fill="none" stroke="var(--rule-strong)" stroke-width="1"/></svg>`;
}
function renderPantry(m) {
  const el = $("pantry");
  if (!m.ready) { el.innerHTML = `<div class="section-head"><h2>Pantry</h2></div><div class="empty">${S.sq.state === "error" ? "Needs sales from Square." : "Reading sales from Square…"}</div>`; return; }
  const rows = m.sup.rows, label = { now: "Order now", soon: "Order soon", ok: "Fine" };
  const SHELVES = [["cereal", "Cereal"], ["cookies", "Cookies, brownies and grahams"], ["fruit", "Fruit"], ["other", "Matcha and granola"], ["supply", "Spoons and float sodas"]];
  let html = "";
  for (const [shelf, title] of SHELVES) {
    const mine = rows.filter(r => E.BY_KEY[r.key].shelf === shelf && r.status !== "uncounted");
    if (!mine.length) continue;
    html += `<div class="shelf"><div class="shelf-name">${title}</div><div class="goods">` + mine.map(r => {
      const c = E.BY_KEY[r.key];
      let units = Math.max(0, r.stock), amt = E.fmtUnits(r.key, r.stock), icons = "";
      if (c.key === "brownies") { units = units / 48; amt = `${Math.round(Math.max(0, r.stock))} servings`; }
      if (c.key === "oreos") amt += `, ${Math.round(Math.max(0, r.stock) * 156)} cookies`;
      if (c.unit === "can") icons = `<span class="amt">${Math.round(units)}</span>`;
      else {
        const full = Math.floor(units + 1e-9), part = units - full, show = Math.min(full, 5);
        for (let i = 0; i < show; i++) icons += pkgSVG(c, 1);
        if (full > 5) icons += `<span class="more">+${full - 5}</span>`;
        if (part > 0.06 || units < 0.06) icons += pkgSVG(c, part);
      }
      const pct = c.unit !== "can" && units < 1 ? `${Math.round(units * 100)}% of a ${c.key === "brownies" ? "Little Debbie box" : c.unit} left` : amt;
      const left = r.cover >= 28 ? "4+ weeks" : `${r.cover} night${r.cover === 1 ? "" : "s"}`;
      return `<div class="good"><div class="pkgs">${icons}</div><div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(pct)}</div></div><div class="right"><span class="pill ${r.status}">${label[r.status]}</span><span class="meta">${left}</span></div></div>`;
    }).join("") + `</div></div>`;
  }
  const unc = rows.filter(r => r.status === "uncounted");
  el.innerHTML = `<div class="section-head"><h2>Pantry</h2><span class="small muted">Nights each item lasts at a busy pace</span></div>
    ${html || `<div class="empty">Count your mix-ins once and they show up here, with how full each box or bag is.</div>`}
    ${unc.length ? `<details class="more"><summary>Not counted yet (${unc.length})</summary><p>${unc.map(r => esc(E.BY_KEY[r.key].name)).join(", ")}. Count them once from the Count button and the app keeps track from then on.</p></details>` : ""}`;
}
function renderWeek(m) {
  const el = $("week"), st = m.st;
  if (!m.ready || !m.week) { el.innerHTML = `<div class="section-head"><h2>Next 7 nights</h2></div><div class="empty">${m.ready ? "Count vanilla and chocolate to see the week." : "Appears once sales load from Square."}</div>`; return; }
  const tot = o => E.ICE.reduce((s, f) => s + (o[f] || 0), 0);
  const maxY = Math.max(st.cap + 1.5, ...m.week.map(n => tot(n.pre)));
  const pct = v => (v / maxY) * 100;
  const bars = m.week.map(n => {
    const pre = tot(n.pre);
    const seg = [["vanilla", "var(--van)"], ["chocolate", "var(--choc)"], ["exclusive", "var(--mint)"]].filter(([f]) => n.pre[f] > 0.01)
      .map(([f, col]) => `<b style="height:${(n.pre[f] / Math.max(pre, 0.01)) * 100}%;background:${col}"></b>`).join("");
    return `<div class="bar"><div class="stack" style="height:${pct(pre)}%">${seg}</div><span class="after" style="bottom:${pct(tot(n.post))}%"></span><span class="fl" style="bottom:${pct(n.floor)}%"></span><span class="lbl" style="bottom:calc(${pct(pre)}% + 4px)">${fmtQ(pre)}</span></div>`;
  }).join("");
  const days = m.week.map((n, k) => {
    const arr = n.arrived ? tot(n.arrived) : 0;
    return `<div><strong>${k === 0 ? "Tonight" : E.DOW[E.weekday(n.ds)]}</strong>${n.closed ? `<span class="muted">Closed</span>` : arr ? `<span class="arr">+${arr} in</span>` : `<span class="muted">&nbsp;</span>`}</div>`;
  }).join("");
  el.innerHTML = `<div class="section-head"><h2>Next 7 nights</h2><span class="small muted">Tubs in the freezer when each night opens</span></div>
    <div class="week"><div class="plot">${bars}<span class="hline cap" style="bottom:${pct(st.cap)}%"><span>Most ${st.cap}</span></span></div><div class="days">${days}</div></div>
    <p class="note">The dark tick is where an average night leaves you. The purple tick is that night's floor (${st.floors.sunWed} Sunday to Wednesday, ${st.floors.thuSat} Thursday to Saturday). Later deliveries assume each morning's suggested Gordon's order gets placed.</p>`;
}
function renderActivity(m) {
  const el = $("activity"), ev = [], byAt = {};
  for (const c of S.data.counts) (byAt[c.at] ||= []).push(c);
  for (const at in byAt) ev.push({ at, t: "Counted " + byAt[at].map(c => `${nameOf(c.item, m.st).toLowerCase()} ${c.item === "brownies" || E.BY_KEY[c.item].step === 1 ? Math.round(c.value) : fmtQ(c.value)}`).join(", ") });
  for (const d of S.data.deliveries) ev.push({ at: d.at, t: `Received ${E.BY_KEY[d.item] && E.BY_KEY[d.item].step === 1 ? d.qty : fmtQ(d.qty)} ${nameOf(d.item, m.st).toLowerCase()}${SUP[d.source] ? " from " + SUP[d.source] : ""}` });
  for (const o of S.data.orders) ev.push({ at: o.placedAt, t: `Ordered from ${SUP[o.supplier]} for ${dayWord(o.arrivesOn, m.cal)}: ${Object.entries(o.lines || {}).filter(([, q]) => q > 0).map(([k, q]) => q + " " + nameOf(k, m.st).toLowerCase()).join(", ")}${o.status === "cancelled" ? " (didn't come)" : o.status === "arrived" ? " (arrived)" : ""}` });

}

function openCount() {
  const m = model(), lc = latestCounts(), vals = {}, est = {};
  for (const c of E.CATALOG) {
    const s = m.stock && m.stock[c.key];
    const e = s ? Math.max(0, s.value) : (lc[c.key] ? lc[c.key].value : null);
    est[c.key] = e;
    vals[c.key] = e == null ? 0 : (c.step === 1 ? Math.round(e) : E.quarter(e));
  }
  const bEst = est.brownies, det = lc.brownies && lc.brownies.detail;
  vals.bLd = bEst != null ? Math.floor(bEst / 48 * 4) / 4 : 0;
  vals.bLoose = bEst != null ? Math.max(0, Math.round(bEst - vals.bLd * 48)) : 0;
  if (det && bEst != null && Math.abs(bEst - (det.ld * 48 + det.loose)) < 0.5) { vals.bLd = det.ld; vals.bLoose = det.loose; }
  openSheet("count", { vals, est, touched: {} });
}
function dbMsg(e) {
  const c = e && e.code;
  if (c === "wrong_passcode") return "The passcode stopped working. Sign in again.";
  if (c === "network") return "Can't reach the server. Check your connection and try again.";
  if (c === "invalid_argument" || c === "no_db") return "This view can't save. Open the app from its link.";
  if (c === "quota_exceeded") return "Storage is full. Ask Claude to clean up old entries.";
  return "Couldn't save. Try again in a moment.";
}
async function saveCount() {
  const d = sheet.data, st = settings(), m = model(), at = new Date().toISOString();
  const keys = Object.keys(d.touched).filter(k => d.touched[k]);
  const learned = { yields: {}, adjust: {} }, notes = [];
  try {
    for (const k of keys) {
      const value = k === "brownies" ? d.vals.bLd * 48 + d.vals.bLoose : d.vals[k];
      const L = E.learn(k, m.stock && m.stock[k], value, st);
      if (L) { if (L.yields) Object.assign(learned.yields, L.yields); if (L.adjust) Object.assign(learned.adjust, L.adjust); if (L.note || L.flag) notes.push({ at, note: L.note || L.flag }); }
      const doc = { item: k, value, at };
      if (k === "brownies") doc.detail = { ld: d.vals.bLd, loose: d.vals.bLoose };
      await Store.add("counts", doc);
    }
    if (Object.keys(learned.yields).length || Object.keys(learned.adjust).length || notes.length) {
      const next = settings();
      Object.assign(next.yields, learned.yields); next.adjust = Object.assign({}, next.adjust, learned.adjust);
      next.learnLog = (next.learnLog || []).concat(notes).slice(-12); next.updatedAt = at;
      await Store.set("config/settings", next);
    }
    closeSheet(); toast(`Saved ${keys.length} count${keys.length === 1 ? "" : "s"}`);
    if (notes.length) setTimeout(() => toast(notes[0].note), 3500);
  } catch (e) { toast(dbMsg(e)); }
}
async function saveOrder() {

}
async function saveArrive() {

function draftSettings() {
  const d = sheet.data, n = id => { const el = $(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? null : v; }, keep = (v, o) => (v == null ? o : v);
  const t = (id, o) => { const el = $(id); return el && /^\d\d:\d\d$/.test(el.value) ? el.value : o; };
  d.cap = keep(n("s-cap"), d.cap);
  d.floors.sunWed = keep(n("s-fsw"), d.floors.sunWed); d.floors.thuSat = keep(n("s-fts"), d.floors.thuSat);
  d.gordon.windows[0].cutoff = t("s-c1", d.gordon.windows[0].cutoff); d.gordon.windows[1].cutoff = t("s-c2", d.gordon.windows[1].cutoff);
  d.gordon.minimum = keep(n("s-gmin"), d.gordon.minimum);
  d.supplies.samsMinimum = keep(n("s-smin"), d.supplies.samsMinimum); d.supplies.coverTo = keep(n("s-cover"), d.supplies.coverTo);
  if ($("s-exon")) d.exclusive.active = $("s-exon").checked;
  if ($("s-exname")) d.exclusive.name = $("s-exname").value;
  d.exclusive.target = keep(n("s-ext"), d.exclusive.target);
  d.yields.vanilla = keep(n("s-yv"), d.yields.vanilla); d.yields.chocolate = keep(n("s-yc"), d.yields.chocolate); d.yields.exclusive = keep(n("s-ye"), d.yields.exclusive);

async function saveSettings() {

    if (sheet.kind === "count") {
      if (id === "bLd" || id === "bLoose") { d.vals[id] = Math.max(0, +(d.vals[id] + dir * (id === "bLd" ? 0.25 : 1)).toFixed(2)); d.touched.brownies = true; }
      else { d.vals[id] = Math.max(0, +(d.vals[id] + dir * E.BY_KEY[id].step).toFixed(2)); d.touched[id] = true; }
    } else if (sheet.kind === "order" || sheet.kind === "arrive") {
      const k = id.slice(2); d.lines[k] = Math.max(0, d.lines[k] + dir);
      if (sheet.kind === "order") { if ($("arrivesSel")) d.arrivesOn = $("arrivesSel").value; if ($("windowSel")) d.window = $("windowSel").value; }
    } else if (sheet.kind === "delivery") {

  switch (act) {
    case "scrim": case "close": closeSheet(); break;
    case "refresh": syncSquare(true); break;
    case "open-count": openCount(); break;
    case "open-delivery": openSheet("delivery", { item: "oreos", qty: 1 }); break;
    case "bought-any": openSheet("delivery", { item: el.dataset.key, qty: +el.dataset.qty || 1 }); break;
    case "open-settings": openSheet("settings", JSON.parse(JSON.stringify(settings()))); break;
    case "place-gordon": if (S.lastGordon) openSheet("order", { supplier: "gordon", lines: Object.assign({}, S.lastGordon.lines), arrivesOn: S.lastGordon.arriveOn, window: S.lastGordon.window }); break;

    case "copy-gordon": if (S.lastGordon) copyText(orderText(S.lastGordon.lines, settings(), "gordon", `deliver ${dayWord(S.lastGordon.arriveOn, calToday())} ${S.lastGordon.window}`)); break;
    case "log-gordon": { const st = settings(), ns = nowStamp(), late = st.gordon.windows[st.gordon.windows.length - 1]; const lines = { vanilla: 0, chocolate: 0 }; if (exOn(st)) lines.exclusive = 0; lines.bananas = 0;

    case "copy-sams": if (S.lastSams) copyText(orderText(S.lastSams.lines, settings(), "sams")); break;

// ---------- passcode gate (website only) ----------
// The rule: nothing from the app is drawn until the server has accepted the passcode,
// and signing out (or the passcode changing) wipes everything loaded so far.
const MARK = `<svg class="mark" viewBox="0 0 40 40" aria-hidden="true" style="width:52px;height:52px"><circle cx="20" cy="20" r="18" fill="var(--accent)"/><circle cx="20" cy="20" r="12.5" fill="var(--van)"/><path d="M20 20 L20 7.5 A12.5 12.5 0 0 1 32.5 20 Z" fill="var(--choc)"/></svg><div class="wordmark" style="font-size:1.4rem">Campus Creamery</div>`;
const isLock = e => !!e && (e.code === "wrong_passcode" || e.code === "too_many_attempts");
function gateMsg(e, remembered) {
  const c = e && e.code;
  if (c === "wrong_passcode") return remembered ? "That passcode no longer works. Enter the current one." : "That passcode didn't work. Try again.";
  if (c === "too_many_attempts") return "Too many wrong tries from this network. Wait 15 minutes, then try again.";
  if (c === "network") return "Couldn't reach the server. Check your internet, then try again.";
  if (c === "not_configured") return "The server isn't set up yet.";

}
function lockScreen(inner) {

  $("root").innerHTML = `<div class="gate">${inner}</div>`;
}
function wipe() {
  S.epoch++;

  S.data = { settingsDoc: null, counts: [], deliveries: [], orders: [] };
  S.daily = null; S.hourly = null; S.truncated = false; S.lastSync = null;
  S.booted = false; S.canSave = false; S.syncing = false; S.sq = { state: "loading" };
}

function gate(err) {
  lockScreen(`<form id="gateForm" novalidate>${MARK}
    <label for="pass" class="muted">Enter the shop passcode to open the freezer.</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    ${err ? `<div class="flag now" role="alert"><span>${esc(err)}</span></div>` : ""}
    <button class="btn primary" type="submit">Open</button></form>`);
  $("gateForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const code = $("pass").value.trim();
    if (!code) return $("pass").focus();
    const btn = ev.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Checking…"; $("pass").disabled = true;
    const ep = S.epoch;
    let st;
    try { st = await Store.signIn(code); }
    catch (e) { if (ep === S.epoch) gate(gateMsg(e)); return; }
    if (ep !== S.epoch) return;
    S.data = st;
    $("root").innerHTML = SHELL; render();
    boot(true);
  });
  setTimeout(() => { const p = $("pass"); if (p) p.focus(); }, 50);
}

// ---------- boot ----------
let timers = false;
async function boot(justSignedIn) {
  if (Store.kind === "web") {
    if (Store.needsPasscode()) return gate();
    if (!justSignedIn) lockScreen(`<div class="gate-box">${MARK}<p class="muted" role="status">Opening the freezer…</p></div>`);
  } else render();
  const ep = S.epoch;
  let r;
  try {
    r = await Store.init(state => { if (ep === S.epoch) { S.data = state; render(); } },
                         e => { if (ep === S.epoch) lockOut(gateMsg(e, true)); });
  } catch (e) {
    if (ep !== S.epoch) return;
    if (isLock(e)) return lockOut(gateMsg(e, true));
    if (Store.kind === "web") return lockScreen(`<div class="gate-box">${MARK}<div class="flag now" role="alert"><span>${esc(gateMsg(e))}</span></div><button class="btn primary" type="button" data-act="retry-boot">Try again</button></div>`);
    const er = sqError(e); S.sq = { state: "error", code: er.code, msg: er.msg }; S.booted = true; S.canSave = false; render(); return;
  }
  if (ep !== S.epoch) return;
  if (!$("shell")) $("root").innerHTML = SHELL;
  S.booted = true; S.canSave = !!r.canSave;
  if (!r.ok || !r.canSales) { const er = sqError({ code: r.code || r.salesCode }); S.sq = { state: "error", code: er.code, msg: er.msg }; render(); return; }
  render();
  await syncSquare(false);
  if (!timers) { timers = true; setInterval(() => { if (!document.hidden) syncSquare(false); }, 5 * 60e3); setInterval(() => { renderStatus(); }, 60e3); }
}
boot();
})();

</script>
